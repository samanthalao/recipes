<script>
  // Carousel functionality
  const recipes = [
    
      {
        title: "Baked Pork Chop Rice",
        image: "",
        url: "/recipes/recipes/baked-pork-chop-rice/"
      },
    
      {
        title: "Matcha Latte",
        image: "",
        url: "/recipes/recipes/matcha-latte/"
      },
    
      {
        title: "Shio Pan",
        image: "/recipes/images/shiopan/IMG_8308.jpg",
        url: "/recipes/recipes/shio-pan/"
      }
    
  ];

  let currentIndex = 0;

  function updateCarousel() {
    if (recipes.length === 0) return;
    
    const recipe = recipes[currentIndex];
    document.getElementById('carousel-image').src = recipe.image;
    document.getElementById('carousel-title').textContent = recipe.title;
    document.getElementById('carousel-link').href = recipe.url;

    // Update indicators
    document.querySelectorAll('.carousel-dot').forEach((dot, index) => {
      dot.classList.toggle('active', index === currentIndex);
    });
  }

  function initCarousel() {
    if (recipes.length === 0) return;

    // Create indicators
    const indicatorsContainer = document.getElementById('carousel-indicators');
    recipes.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
      dot.addEventListener('click', () => {
        currentIndex = index;
        updateCarousel();
      });
      indicatorsContainer.appendChild(dot);
    });

    updateCarousel();

    // Auto-rotate carousel every 5 seconds
    setInterval(() => {
      currentIndex = (currentIndex + 1) % recipes.length;
      updateCarousel();
    }, 5000);

    // Button listeners
    document.getElementById('prev-btn').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + recipes.length) % recipes.length;
      updateCarousel();
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % recipes.length;
      updateCarousel();
    });
  }

  // Initialize when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCarousel);
  } else {
    initCarousel();
  }
</script>
